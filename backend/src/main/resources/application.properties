spring.application.name=backend

# Do not create the default user with a generated password (it would be written to the log)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Database (PostgreSQL)
# Connection settings come from environment variables; never write credentials in this file.
# DB_URL defaults to a local PostgreSQL for development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crossborderpayment}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
# Schema changes must not be applied automatically; only check that entities match the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Error responses: do not expose internal details to clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------------------------------------------------------
# Authentication (passkey / WebAuthn + e-mail one-time code for registration and recovery)
# ---------------------------------------------------------------------------

# Origins allowed to call the API from a browser (comma separated). Also used as the WebAuthn allowed origins.
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}
# WebAuthn Relying Party: rp-id must be the site's registrable domain (e.g. example.com) in production
app.security.webauthn.rp-id=${APP_WEBAUTHN_RP_ID:localhost}
app.security.webauthn.rp-name=Cross-Border Payment Service

# Absolute session lifetime after a passkey login (independent of the idle timeout below)
app.security.session.absolute-timeout=8h
# Lifetime of the limited session that only allows registering a passkey after e-mail verification
app.security.session.enrollment-timeout=10m
# Adding / removing passkeys requires a passkey login within this window
app.security.session.reauthentication-window=5m

app.security.email-verification.code-ttl=10m
app.security.email-verification.max-attempts=5
app.security.email-verification.max-requests-per-window=3
app.security.email-verification.request-window=1h
# Base64 HMAC key (at least 32 bytes) for one-time code hashes. Required: set the same value on every instance.
# Startup fails when it is empty, unless allow-random-hmac-key is true (local profile and tests only).
app.security.email-verification.hmac-key=${APP_OTP_HMAC_KEY:}
app.security.email-verification.allow-random-hmac-key=false
# Sender address verified by the mail service (e.g. SES). Required: startup fails when it is empty.
app.security.mail.from=${APP_MAIL_FROM:}

# Secure (HTTPS-only) cookies. Keep true in every deployed environment.
app.security.secure-cookies=${APP_SECURE_COOKIES:true}

# Server-side session (idle timeout, cookie-only tracking, hardened cookie)
server.servlet.session.timeout=15m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=${APP_SESSION_COOKIE_NAME:__Host-SESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/

# Outgoing mail (SMTP). Host / port / credentials come from SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD; never write them in this file.
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
