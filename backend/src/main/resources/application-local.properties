# Local development profile: SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
# Never activate this profile in a deployed environment (the H2 driver is not even packaged into the jar).

# Database: H2 file database in PostgreSQL compatibility mode (kept under build/, removed by "gradlew clean").
# The schema is created by the same Flyway migrations as production.
# Local-only database without any data worth protecting, so no password is needed.
spring.datasource.url=jdbc:h2:file:./build/local-db/crossborderpayment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# The H2 web console stays disabled (it has had remote code execution vulnerabilities)
spring.h2.console.enabled=false

# Mail: Mailpit on this machine (SMTP 127.0.0.1:1025, inbox at http://localhost:8025), no TLS.
# 127.0.0.1 rather than "localhost", which may resolve to IPv6 (::1) first.
# Start Mailpit with reverse DNS disabled, otherwise the SMTP greeting can hang:
#   docker run -d --rm --name mailpit -e MP_SMTP_DISABLE_RDNS=true \
#     -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.security.mail.from=no-reply@localhost

# One-time code HMAC key: a random key per process is fine on this machine (codes are lost on restart).
# Set APP_OTP_HMAC_KEY to keep codes valid across restarts.
app.security.email-verification.allow-random-hmac-key=true
