spring.application.name=backend

# Do not create the default user with a generated password (it would be written to the log)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Tests use an in-memory H2 database in MySQL compatibility mode (no external DB needed, e.g. on CircleCI)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
# @DataJpaTest must use this MySQL-mode H2 instead of replacing it with a default-mode embedded database
spring.test.database.replace=none
spring.datasource.password=

# Schema is created by Flyway migrations; Hibernate only validates it (same as production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

app.security.allowed-origins=http://localhost:3000
app.security.webauthn.rp-id=localhost
app.security.webauthn.rp-name=Cross-Border Payment Service
app.security.session.absolute-timeout=8h
app.security.session.enrollment-timeout=10m
app.security.session.reauthentication-window=5m
app.security.email-verification.code-ttl=10m
app.security.email-verification.max-attempts=5
app.security.email-verification.max-requests-per-window=3
app.security.email-verification.request-window=1h
app.security.email-verification.hmac-key=
app.security.email-verification.allow-random-hmac-key=true
app.security.mail.from=no-reply@localhost
# Tests do not send e-mail (AuthMailSender is mocked or no SMTP server is configured)
app.security.mail.allow-missing-smtp=true
app.security.secure-cookies=true
server.servlet.session.timeout=15m
