version: 2.1

# Pipeline: test-backend and test-frontend run on every push; build-and-deploy runs only on main after both pass.

# Required CircleCI project environment variables (Project Settings > Environment Variables; never commit them):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  IAM user for deployment (ECR push and ECS update only)
#   AWS_REGION                                e.g. ap-northeast-1
#   AWS_ACCOUNT_ID
#   ECS_CLUSTER                               ECS cluster name
#   ECS_BACKEND_SERVICE, ECS_FRONTEND_SERVICE ECS service names (their task definitions use the ":latest" images)
# Application settings and secrets (DB_*, APP_*, SPRING_MAIL_*) belong to the ECS task definition, not to CircleCI.

executors:
    java-executor:
        docker:
            # Tests use an in-memory H2 database (src/test/resources/application.properties): no DB container needed
            -   image: cimg/openjdk:17.0
        working_directory: ~/project
    node-executor:
        docker:
            -   image: cimg/node:18.20
        working_directory: ~/project
    deploy-executor:
        docker:
            -   image: cimg/base:stable
        working_directory: ~/project

jobs:
    test-backend:
        executor: java-executor
        steps:
            - checkout
            -   restore_cache:
                    keys:
                        - gradle-v1-{{ checksum "backend/build.gradle" }}-{{ checksum "backend/gradle/wrapper/gradle-wrapper.properties" }}
                        - gradle-v1-
            -   run:
                    name: Run backend tests
                    working_directory: backend
                    command: ./gradlew --no-daemon check
            -   save_cache:
                    key: gradle-v1-{{ checksum "backend/build.gradle" }}-{{ checksum "backend/gradle/wrapper/gradle-wrapper.properties" }}
                    paths:
                        - ~/.gradle/caches
                        - ~/.gradle/wrapper
            -   store_test_results:
                    path: backend/build/test-results/test
            -   store_artifacts:
                    path: backend/build/reports/tests/test
                    destination: backend-test-report

    test-frontend:
        executor: node-executor
        steps:
            - checkout
            -   restore_cache:
                    keys:
                        - npm-v1-{{ checksum "frontend/package-lock.json" }}
            -   run:
                    name: Install dependencies
                    working_directory: frontend
                    command: npm ci
            -   save_cache:
                    key: npm-v1-{{ checksum "frontend/package-lock.json" }}
                    paths:
                        - ~/.npm
            -   run:
                    name: Type check
                    working_directory: frontend
                    command: npm run typecheck
            -   run:
                    name: Lint
                    working_directory: frontend
                    command: npm run lint
            -   run:
                    name: Run frontend tests
                    working_directory: frontend
                    command: npx vitest run
            -   run:
                    name: Build
                    working_directory: frontend
                    command: npm run build

    build-and-deploy:
        executor: deploy-executor
        environment:
            BACKEND_REPOSITORY: cross-border-payment-backend
            FRONTEND_REPOSITORY: cross-border-payment-frontend
        steps:
            - checkout
            - setup_remote_docker
            -   run:
                    name: Install AWS CLI
                    command: |
                        sudo apt-get update && sudo apt-get install -y unzip curl
                        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                        unzip -q awscliv2.zip
                        ./aws/install --install-dir "$HOME/aws-cli" --bin-dir "$HOME/bin"
                        echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"
                        source "$BASH_ENV"
                        aws --version
            -   run:
                    name: Set image names
                    command: |
                        REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                        echo "export REGISTRY=${REGISTRY}" >> "$BASH_ENV"
                        echo "export IMAGE_TAG=${CIRCLE_SHA1:0:7}" >> "$BASH_ENV"
            -   run:
                    name: Build Docker images
                    command: |
                        docker build --platform linux/amd64 -t "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" ./backend
                        docker tag "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$BACKEND_REPOSITORY:latest"
                        docker build --platform linux/amd64 -t "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" ./frontend
                        docker tag "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$FRONTEND_REPOSITORY:latest"
            -   run:
                    name: Push to Amazon ECR
                    command: |
                        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
                        for repository in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
                          docker push "$REGISTRY/$repository:$IMAGE_TAG"
                          docker push "$REGISTRY/$repository:latest"
                        done
            -   run:
                    name: Deploy to Amazon ECS
                    command: |
                        for service in "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"; do
                          aws ecs update-service --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --service "$service" \
                            --force-new-deployment --query 'service.serviceName' --output text
                        done
                        aws ecs wait services-stable --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
                          --services "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"

workflows:
    ci:
        jobs:
            - test-backend
            - test-frontend
            # Deploy only from main, and only after all tests passed
            -   build-and-deploy:
                    requires:
                        - test-backend
                        - test-frontend
                    filters:
                        branches:
                            only: main
